<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Killer of Men — Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--panel:#1b2c4f;--line:#2a3d66;--cream:#f3ecd8;--mute:#b7bdcc;--dim:#7f8aa6}
*{box-sizing:border-box}html,body{margin:0;background:#0f1930;color:var(--cream);font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.4}
.bd{max-width:980px;margin:24px auto;background:var(--ink);border-radius:12px;padding:18px 22px 14px;position:relative;overflow:hidden;transition:opacity .3s}
.bd.stale{opacity:.6}
.pat{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:radial-gradient(var(--cream) 1px,transparent 1.2px),radial-gradient(var(--cream) 1px,transparent 1.2px);background-size:22px 22px;background-position:0 0,11px 11px}
.top{position:relative;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ttl{font-size:20px;font-weight:500}.ttl small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:5px}
.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;background:var(--line);margin:0 -22px}
.card{background:var(--ink);padding:16px 22px 18px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px;font-weight:500}
.card a{color:var(--cream);text-decoration:none;border-bottom:1px solid var(--dim)}.card a:hover{border-bottom-color:var(--cream)}
.big{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.big span{font-size:13px;color:var(--mute);font-weight:400;margin-left:6px}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cream);border-radius:3px;transition:width .3s}
.rows{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute);margin-top:2px}
.rows div{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.rows div>span{white-space:nowrap}
.rows b{color:var(--cream);font-weight:400;text-align:right}
.rows .w{color:var(--dim)}
.err{color:#e8703a}
.foot{margin-top:12px;font-size:11px;color:var(--mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;position:relative}
</style></head><body>
<div class="bd" id="bd"><div class="pat"></div>
  <div class="top"><div class="ttl">Killer of Men — Campaign<small id="sub">reading…</small></div></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span id="prov">reading…</span><span id="checked"></span></div>
</div>
<script>
(function(){
var LOCAL=(location.hostname==='localhost'||location.hostname==='127.0.0.1'),EVERY=LOCAL?3000:15000;
var SRC=[{k:'board',f:'data.json'},{k:'docket',f:'todo.json'},{k:'epk',f:'press/epk.json'}];
var data={},lastGood=null,stamp=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function days(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');if(!m)return null;
  return Math.round((new Date(+m[1],+m[2]-1,+m[3])-today())/86400000);}
function when(n){return n===null?'':n<0?Math.abs(n)+' days ago':n===0?'today':n===1?'tomorrow':'in '+n+' days';}
function fmt(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');if(!m)return esc(iso||'');
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function clock(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function short(t){t=String(t).split(' — ')[0];return t.length>30?t.slice(0,29)+'…':t;}
function bar(a,b){var p=b?Math.round(a/b*100):0;return'<div class="bar"><i style="width:'+p+'%"></i></div>';}
function rows(list){return'<div class="rows">'+list.map(function(r){
  return'<div><span'+(r[2]?' class="w"':'')+'>'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('')+'</div>';}

function board(d){
  var f=d.festivals||[],t=f.filter(function(x){return x.disposition==='target';});
  var ver=t.filter(function(x){return x.provenance==='official'&&x.source;});
  var up=ver.filter(function(x){return x.close&&days(x.close)!==null&&days(x.close)>=0;})
           .sort(function(a,b){return a.close<b.close?-1:1;})[0];
  var prem=(d.premieres||[]).filter(function(p){return p.state==='available';}).length;
  // read the flag the board's validator writes; the rule lives there, not here
  var tier=t.filter(function(x){return x.closeUnverifiedTier;}).length;
  return'<h2><a href="board.html">Festival board</a></h2>'+
    '<div class="big">'+t.length+'<span>targets of '+f.length+' researched</span></div>'+bar(t.length,f.length)+
    rows([
      ['next deadline', up?esc(short(up.name))+' '+fmt(up.close)+' · '+when(days(up.close)):'none verified yet'],
      ['verified at the festival', ver.length+' of '+t.length, ver.length<t.length],
      ['may be a price step', tier, tier>0],
      ['premieres available', prem]
    ]);
}
function docket(d){
  var all=[],done=0;
  (d.sections||[]).forEach(function(s){s.items.forEach(function(it){all.push(it);if(it.status==='complete')done++;});});
  var open=all.filter(function(it){return(it.status==='not_started'||it.status==='started')&&!it.waitingOn;});
  var nx=open.filter(function(it){return it.status==='started';})[0]||open[0];
  var by={},n=0;
  all.forEach(function(it){if(it.status==='complete')return;if(!it.waitingOn&&it.status!=='awaiting')return;
    var k=it.waitingOn?String(it.waitingOn).split(' · ')[0]:'a reply';by[k]=(by[k]||0)+1;n++;});
  var who=Object.keys(by).sort(function(a,b){return by[b]-by[a]||a.toLowerCase().localeCompare(b.toLowerCase());})
    .map(function(k){return k+' '+by[k];}).join(' · ');
  var soon=all.filter(function(it){return it.status!=='complete'&&it.due&&days(it.due)!==null&&days(it.due)<=7&&days(it.due)>=0;});
  return'<h2><a href="docket.html">The Docket</a></h2>'+
    '<div class="big">'+done+'<span>of '+all.length+' done</span></div>'+bar(done,all.length)+
    rows([
      ['next unblocked', nx?esc(nx.id):'nothing unblocked'],
      ['waiting on', who||'nobody', !who],
      ['dated this week', soon.length?soon.length+' · '+fmt(soon[0].due):'none']
    ]);
}
function epk(d){
  var fl=[];(d.sections||[]).forEach(function(s){(s.fields||[]).forEach(function(x){fl.push(x);});});
  var filled=fl.filter(function(x){return String(x.value==null?'':x.value).trim()!=='';});
  var empty=(d.sections||[]).map(function(s){
    var e=(s.fields||[]).filter(function(x){return String(x.value==null?'':x.value).trim()==='';}).length;
    return{n:s.name,e:e};}).sort(function(a,b){return b.e-a.e;})[0];
  return'<h2><a href="epk.html">Electronic press kit</a></h2>'+
    '<div class="big">'+filled.length+'<span>of '+fl.length+' fields filled</span></div>'+bar(filled.length,fl.length)+
    rows([
      ['sections', (d.sections||[]).length],
      ['emptiest section', empty?esc(short(empty.n))+' · '+empty.e:'—', true],
      ['left to fill', fl.length-filled.length]
    ]);
}
var CARD={board:board,docket:docket,epk:epk};
function stampOf(){return SRC.map(function(s){var d=data[s.k];return d?d.rev+'/'+d.updated:'-';}).join('|');}
function render(){
  var sp=stampOf();if(sp===stamp)return;stamp=sp;
  $('grid').innerHTML=SRC.map(function(s){
    var d=data[s.k];
    if(!d)return'<div class="card"><h2>'+esc(s.k)+'</h2><div class="rows"><div><span class="err">'+esc(s.f)+' could not be read</span></div></div></div>';
    try{return'<div class="card">'+CARD[s.k](d)+'</div>';}
    catch(e){return'<div class="card"><h2>'+esc(s.k)+'</h2><div class="rows"><div><span class="err">'+esc(e.message)+'</span></div></div></div>';}
  }).join('');
  var got=SRC.filter(function(s){return data[s.k];}).length;
  $('sub').textContent=got+' of '+SRC.length+' surfaces reporting';
  $('prov').textContent=SRC.map(function(s){var d=data[s.k];
    return s.k+(d?' rev '+String(d.rev).slice(0,8)+' · '+clock(d.updated):' unread');}).join('   ·   ');
}
function poll(){
  Promise.all(SRC.map(function(s){
    return fetch(s.f+'?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(j){data[s.k]=j;}).catch(function(){});
  })).then(function(){
    if(Object.keys(data).length){lastGood=Date.now();$('bd').classList.remove('stale');}
    render();
    $('checked').textContent='checked '+(lastGood?Math.round((Date.now()-lastGood)/1000):'?')+' s ago · every '+(EVERY/1000)+' s';
  });
}
poll();setInterval(poll,EVERY);
setInterval(function(){if(lastGood)$('checked').textContent='checked '+Math.round((Date.now()-lastGood)/1000)+' s ago · every '+(EVERY/1000)+' s';
  if(lastGood&&Date.now()-lastGood>EVERY*3)$('bd').classList.add('stale');},1000);
})();
</script></body></html>

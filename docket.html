<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Killer of Men Festival Campaign — the Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--panel:#1b2c4f;--line:#2a3d66;--cream:#f3ecd8;--mute:#b7bdcc;--dim:#7f8aa6;--s0:#9aa3b8;--s1:#5fb3e0;--s2:#e6a92a;--s3:#2bb673}
*{box-sizing:border-box}html,body{margin:0;background:#0f1930;color:var(--cream);font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.4}
.bd{max-width:860px;margin:24px auto;background:var(--ink);border-radius:12px;padding:18px 22px 14px;position:relative;overflow:hidden;transition:opacity .3s}
.bd.stale{opacity:.6}
.pat{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:radial-gradient(var(--cream) 1px,transparent 1.2px),radial-gradient(var(--cream) 1px,transparent 1.2px);background-size:22px 22px;background-position:0 0,11px 11px}
.top{position:relative;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ttl{font-size:20px;font-weight:500}.ttl small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:5px}
.map{display:flex;flex-direction:column;gap:5px;align-items:flex-end}.mrow{display:flex;gap:3px;align-items:center}.mrow .k{width:6px;height:6px;border-radius:50%;margin-right:6px}
.blk{width:12px;height:8px;border-radius:1.5px;border:1px solid var(--sc);background:transparent;transition:background .25s,border-color .25s}
.blk.s1{background:var(--s1);border-color:var(--s1)}.blk.s2{background:var(--s2);border-color:var(--s2)}.blk.s3{background:var(--s3);border-color:var(--s3)}
.g{position:relative;border-bottom:1px solid var(--line)}
.h{display:grid;grid-template-columns:18px 1fr auto 96px;gap:12px;align-items:center;min-height:52px;cursor:pointer;user-select:none}
.h .ch{color:var(--dim);font-size:11px;transition:transform .15s}.g.open .h .ch{transform:rotate(90deg)}
.h .nm{font-size:16px;font-weight:500;color:var(--sc)}.h .nm small{font-size:11px;color:var(--mute);font-weight:400;margin-left:8px}
.h .blocks{display:flex;gap:3px;flex-wrap:wrap;max-width:200px}.h .ct{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.items{display:none;padding:0 0 10px 30px;border-left:2px solid var(--sc);margin-left:8px}.g.open .items{display:block}
.it{display:grid;grid-template-columns:160px 1fr 64px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid rgba(42,61,102,.6)}.it:first-child{border-top:0}
.dial{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);white-space:nowrap}.dial svg{width:18px;height:18px;flex:none}
.it.c1 .dial .w{color:var(--s1)}.it.c2 .dial .w{color:var(--s2)}.it.c3 .dial .w{color:var(--s3)}
.t .ref{color:var(--dim);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}.t .who{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}.t .who.w:before{content:"⌀ ";color:var(--s2)}
.it.c3 .t{color:var(--mute)}.d{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}.d b{color:var(--cream);font-weight:500}
.foot{margin-top:10px;font-size:11px;color:var(--mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;position:relative}
.leg{display:flex;gap:14px}.leg span{display:inline-flex;align-items:center;gap:5px}.leg svg{width:14px;height:14px}
.ctl{color:var(--mute);text-decoration:underline;cursor:pointer}
#err{color:#e8703a}
@media (max-width:640px){.top{grid-template-columns:1fr}.map{align-items:flex-start}.it{grid-template-columns:1fr;gap:4px}.d{text-align:left}.h{grid-template-columns:18px 1fr 80px}.h .blocks{grid-column:1/-1;padding-left:30px;padding-bottom:8px}}
</style></head><body>
<div class="bd" id="bd"><div class="pat"></div>
  <div class="top"><div><div class="ttl" id="ttl">Killer of Men Festival Campaign<small id="tot">loading…</small></div></div><div class="map" id="map"></div></div>
  <div id="groups"></div>
  <div class="foot"><div class="leg" id="leg"></div><span id="prov">reading todo.json…</span></div>
</div>
<script>
(function(){
var S=['not_started','started','awaiting','complete'],SC={},LAB={},open={},lastRev=null,lastGood=null;
function sprite(k,c){var s='<svg viewBox="0 0 18 18" aria-hidden="true">';
  if(k===0)s+='<circle cx="9" cy="9" r="6.5" fill="none" stroke="'+c+'" stroke-width="1.6"/>';
  else if(k===1)s+='<circle cx="9" cy="9" r="6.5" fill="none" stroke="'+c+'" stroke-width="1.6"/><path d="M9 2.5a6.5 6.5 0 0 1 0 13z" fill="'+c+'"/>';
  else if(k===2)s+='<circle cx="9" cy="9" r="6.5" fill="none" stroke="'+c+'" stroke-width="1.6"/><line x1="4.4" y1="13.6" x2="13.6" y2="4.4" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/>';
  else s+='<circle cx="9" cy="9" r="7.3" fill="'+c+'"/>';return s+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function fmt(iso){if(!iso)return'';var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);var d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(iso);return isNaN(d)?iso:d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function render(d){
  SC=d.statusColors||{};LAB=d.statusLabels||{};var st=d.statuses||S;
  var map='',groups='',done=0,N=0;
  d.sections.forEach(function(s,gi){
    var blocks=s.items.map(function(it){var k=st.indexOf(it.status);return'<i class="blk'+(k>0?' s'+k:'')+'"></i>';}).join('');
    map+='<div class="mrow" style="--sc:'+s.color+'"><i class="k" style="background:'+s.color+'"></i>'+blocks+'</div>';
    var c=s.items.filter(function(it){return it.status==='complete';}).length;done+=c;N+=s.items.length;
    var isOpen=open[s.id]===undefined?gi===0:open[s.id];
    groups+='<div class="g'+(isOpen?' open':'')+'" data-g="'+s.id+'" style="--sc:'+s.color+'"><div class="h"><span class="ch">▶</span><span class="nm">'+esc(s.name)+(s.timing?'<small>'+esc(s.timing)+'</small>':'')+'</span><div class="blocks">'+blocks+'</div><span class="ct">'+c+' / '+s.items.length+' complete</span></div><div class="items">'+
      s.items.map(function(it){var k=st.indexOf(it.status);return'<div class="it c'+k+'"><div class="dial">'+sprite(k,SC[it.status]||'#9aa3b8')+'<span class="w">'+esc(LAB[it.status]||it.status)+'</span></div><div class="t"><span class="ref">'+esc(it.id)+'</span>'+esc(it.title)+'<span class="who'+(it.waitingOn?' w':'')+'">'+esc(it.waitingOn?'waiting on '+it.waitingOn:it.owner)+'</span></div><div class="d">'+(it.due?'<b>'+fmt(it.due)+'</b>':'')+'</div></div>';}).join('')+'</div></div>';
  });
  document.getElementById('map').innerHTML=map;document.getElementById('groups').innerHTML=groups;
  document.getElementById('tot').innerHTML=done+' of '+N+' complete · <span class="ctl" id="all">expand all</span>';
  document.getElementById('leg').innerHTML=st.map(function(k,i){return'<span style="color:'+SC[k]+'">'+sprite(i,SC[k])+esc(LAB[k]||k)+'</span>';}).join('');
  if(d.title)document.getElementById('ttl').firstChild.textContent=d.title;
}
function prov(d,ageS){document.getElementById('prov').innerHTML='todo.json rev '+d.rev+' · written '+new Date(d.updated).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' by '+esc(d.updatedBy)+' · checked '+ageS+' s ago · every 3 s';}
var last=null,lastAt=0;
function poll(){
  fetch('todo.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){
    lastGood=Date.now();document.getElementById('bd').classList.remove('stale');
    if(d.rev!==lastRev){lastRev=d.rev;last=d;render(d);}
    prov(d,0);
  }).catch(function(e){
    var age=lastGood?Math.round((Date.now()-lastGood)/1000):null;
    if(age!==null&&age>9)document.getElementById('bd').classList.add('stale');
    document.getElementById('prov').innerHTML='<span id="err">'+esc(e.message)+'</span>'+(last?' · stale '+age+' s · last good rev '+last.rev:'');
  });
}
document.addEventListener('click',function(e){
  var h=e.target.closest('.h');if(h){var g=h.parentElement;g.classList.toggle('open');open[g.dataset.g]=g.classList.contains('open');return;}
  if(e.target.id==='all'){var any=document.querySelectorAll('.g:not(.open)').length>0;document.querySelectorAll('.g').forEach(function(g){g.classList.toggle('open',any);open[g.dataset.g]=any;});e.target.textContent=any?'collapse all':'expand all';}
});
poll();setInterval(poll,3000);
setInterval(function(){if(last&&lastGood)prov(last,Math.round((Date.now()-lastGood)/1000));},1000);
})();
</script></body></html>

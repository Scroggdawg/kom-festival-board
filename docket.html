<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.github.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Killer of Men Festival Campaign — the Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--panel:#1b2c4f;--line:#2a3d66;--cream:#f3ecd8;--mute:#b7bdcc;--dim:#7f8aa6;--s0:#9aa3b8;--s1:#5fb3e0;--s2:#e6a92a;--s3:#2bb673}
*{box-sizing:border-box}html,body{margin:0;background:#0f1930;color:var(--cream);font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.4}
.bd{max-width:860px;margin:24px auto;background:var(--ink);border-radius:12px;padding:18px 22px 14px;position:relative;overflow:hidden;transition:opacity .3s}
.bd.stale{opacity:.6}
.pat{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:radial-gradient(var(--cream) 1px,transparent 1.2px),radial-gradient(var(--cream) 1px,transparent 1.2px);background-size:22px 22px;background-position:0 0,11px 11px}
.top{position:relative;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ttl{font-size:20px;font-weight:500}.ttl small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:5px}
.map{display:flex;flex-direction:column;gap:5px;align-items:flex-end}.mrow{display:flex;gap:3px;align-items:center}.mrow .k{width:6px;height:6px;border-radius:50%;margin-right:6px}
.blk{width:12px;height:8px;border-radius:1.5px;border:1px solid var(--sc);background:transparent;transition:background .25s,border-color .25s}
.blk.s1{border-color:var(--s1);background:linear-gradient(90deg,var(--s1) 0 50%,transparent 50% 100%)}
.blk.s2{border-color:var(--s2);background:linear-gradient(135deg,transparent 0 38%,var(--s2) 38% 62%,transparent 62% 100%)}
.blk.s3{background:var(--s3);border-color:var(--s3)}
.mrow .ml{font-size:10px;color:var(--dim);min-width:50px;text-align:right;letter-spacing:.02em}
.g{position:relative;border-bottom:1px solid var(--line)}
.h{display:grid;grid-template-columns:18px 1fr auto 96px;gap:12px;align-items:center;min-height:52px;cursor:pointer;user-select:none}
.h .ch{color:var(--dim);font-size:11px;transition:transform .15s}.g.open .h .ch{transform:rotate(90deg)}
.h .nm{font-size:16px;font-weight:500;color:var(--sc)}.h .nm small{font-size:11px;color:var(--mute);font-weight:400;margin-left:8px}
.h .blocks{display:flex;gap:3px;flex-wrap:wrap;max-width:200px}.h .ct{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.items{display:none;padding:0 0 10px 30px;border-left:2px solid var(--sc);margin-left:8px}.g.open .items{display:block}
.it{display:grid;grid-template-columns:160px 1fr 64px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid rgba(42,61,102,.6)}.it:first-child{border-top:0}
.dial{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);white-space:nowrap;cursor:pointer;border-radius:6px;margin-left:-5px;padding:3px 5px;border:1px solid transparent}
.dial:hover{background:rgba(243,236,216,.06)}.dial:focus-visible{outline:none;border-color:var(--dim)}
.it.busy .dial{opacity:.45;cursor:progress}.dial svg{width:18px;height:18px;flex:none}
.it.c1 .dial .w{color:var(--s1)}.it.c2 .dial .w{color:var(--s2)}.it.c3 .dial .w{color:var(--s3)}
.t .ref{color:var(--dim);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}.t .who{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}.t .who.w:before{content:"⌀ ";color:var(--s2)}
.it.c3 .t{color:var(--mute)}.d{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}.d b{color:var(--cream);font-weight:500}
.d .rel{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.it.due .d{border-bottom:1px solid var(--cream);padding-bottom:3px}.it.due .d .rel{color:var(--cream);font-weight:500}
#tot .soon{color:var(--cream)}
.nx{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.nx .k{color:var(--dim);margin-right:8px}.nx .ref{color:var(--dim);font-variant-numeric:tabular-nums;margin-right:6px}.nx b{color:var(--cream);font-weight:400}
@media (max-width:640px){.nx{grid-template-columns:1fr;gap:4px}}
.foot{margin-top:10px;font-size:11px;color:var(--mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;position:relative}
.leg{display:flex;gap:14px}.leg span{display:inline-flex;align-items:center;gap:5px}.leg svg{width:14px;height:14px}
.ctl{color:var(--mute);text-decoration:underline;cursor:pointer}#msg a{color:var(--cream)}#err{color:#e8703a}
.sheet{position:relative;margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12.5px}
.sheet p{margin:0 0 10px;color:var(--mute);line-height:1.5}.sheet b{color:var(--cream);font-weight:500}
.sheet input[type=password]{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:8px 10px;font:inherit}
.sheet label{display:block;margin:10px 0 4px}.sheet label.inline{display:flex;align-items:center;gap:8px}
.sheet .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sheet button{font:inherit;background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.sheet button.pri{border-color:var(--cream)}
@media (max-width:640px){.top{grid-template-columns:1fr}.map{align-items:flex-start}.it{grid-template-columns:1fr;gap:4px}.d{text-align:left}.h{grid-template-columns:18px 1fr 80px}.h .blocks{grid-column:1/-1;padding-left:30px;padding-bottom:8px}}
</style></head><body>
<div class="bd" id="bd"><div class="pat"></div>
  <div class="top"><div><div class="ttl" id="ttl">Killer of Men Festival Campaign<small id="tot">loading…</small></div><div style="font-size:11px;margin-top:6px"><a href="index.html" style="color:var(--mute)">← campaign dashboard</a></div></div><div class="map" id="map"></div></div>
  <div class="nx" id="nx" hidden></div>
  <div id="groups"></div>
  <div class="foot"><div class="leg" id="leg"></div><span id="prov">reading todo.json…</span></div>
  <div class="foot"><span id="msg"></span><span id="tokctl"></span></div>
  <div id="sheet" hidden></div>
</div>
<script>
(function(){
var S=['not_started','started','awaiting','complete'],SC={},LAB={},open={},last=null,stamp=null,lastGood=null,etag=null,errShown=false;
var LOCAL=(location.hostname==='localhost'||location.hostname==='127.0.0.1');
var REPO='Scroggdawg/kom-festival-board',BRANCH='main',API='https://api.github.com/repos/'+REPO+'/contents/todo.json',TOK_S='kom-token';
var EVERY=LOCAL?3000:10000,pushSeen=null,pendingNote='';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function colour(c){return /^#[0-9a-fA-F]{3,8}$/.test(String(c))?String(c):'#9aa3b8';}
function sprite(k,c){c=colour(c);var s='<svg viewBox="0 0 18 18" aria-hidden="true">';
  if(k===0)s+='<circle cx="9" cy="9" r="6.5" fill="none" stroke="'+c+'" stroke-width="1.6"/>';
  else if(k===1)s+='<circle cx="9" cy="9" r="6.5" fill="none" stroke="'+c+'" stroke-width="1.6"/><path d="M9 2.5a6.5 6.5 0 0 1 0 13z" fill="'+c+'"/>';
  else if(k===2)s+='<circle cx="9" cy="9" r="6.5" fill="none" stroke="'+c+'" stroke-width="1.6"/><line x1="4.4" y1="13.6" x2="13.6" y2="4.4" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/>';
  else s+='<circle cx="9" cy="9" r="7.3" fill="'+c+'"/>';return s+'</svg>';}
function fmt(iso){if(!iso)return'';var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);var d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(iso);return isNaN(d)?iso:d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function dueInfo(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');if(!m)return null;
  var due=new Date(+m[1],+m[2]-1,+m[3]),t=new Date();t.setHours(0,0,0,0);
  var n=Math.round((due-t)/86400000);
  var label=n<-1?Math.abs(n)+' days ago':n===-1?'yesterday':n===0?'today':n===1?'tomorrow':n<=7?'in '+n+' days':'';
  return {n:n,label:label,urgent:n<=1};
}
function soonPhrase(ns){
  if(!ns.length)return'';
  var over=ns.filter(function(n){return n<0;}),today=ns.filter(function(n){return n===0;}),tom=ns.filter(function(n){return n===1;});
  var g=over.length?[over.length,'overdue']:today.length?[today.length,'due today']:[tom.length,'due tomorrow'];
  return g[0]+(g[0]===1?' item ':' items ')+g[1];
}
function clock(iso){var d=new Date(iso);return isNaN(d)?String(iso):d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function nowIso(){var d=new Date(),o=-d.getTimezoneOffset(),p=function(n){return(n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+(o>=0?'+':'-')+p(Math.floor(Math.abs(o)/60))+':'+p(Math.abs(o)%60);}
function msg(t,isHtml){var m=$('msg');if(isHtml)m.innerHTML=t;else m.textContent=t;}
function stampOf(d){return d?[d.rev,d.updated,d.updatedBy].join('|'):null;}

function holder(w){return String(w||'').split(' · ')[0];}
function nextUnblocked(d){
  var open=[];d.sections.forEach(function(s){s.items.forEach(function(it){
    if((it.status==='not_started'||it.status==='started')&&!it.waitingOn)open.push(it);});});
  if(!open.length)return null;
  for(var i=0;i<open.length;i++)if(open[i].status==='started')return open[i];
  return open[0];
}
function parked(d){
  var by={},n=0;
  d.sections.forEach(function(s){s.items.forEach(function(it){
    if(it.status==='complete')return;
    if(!it.waitingOn&&it.status!=='awaiting')return;
    var k=it.waitingOn?holder(it.waitingOn):'a reply';by[k]=(by[k]||0)+1;n++;});});
  return{n:n,list:Object.keys(by).sort(function(a,b){return by[b]-by[a]||a.localeCompare(b);}).map(function(k){return k+' '+by[k];})};
}
function strip(d){
  var el=$('nx'),nx=nextUnblocked(d),pk=parked(d),left,right='';
  if(!nx&&!pk.n){el.hidden=true;return;}
  el.hidden=false;
  if(nx){var t=nx.title.length>72?nx.title.slice(0,71)+'…':nx.title;
    left='<span class="k">Next</span><span class="ref">'+esc(nx.id)+'</span><b>'+esc(t)+'</b>';}
  else left='<span class="k">Next</span>every remaining item is waiting on someone';
  if(pk.n)right='<span class="k">Waiting on</span>'+esc(pk.list.join(' · '));
  el.innerHTML='<div>'+left+'</div><div>'+right+'</div>';
}
function render(d){
  SC=d.statusColors||{};LAB=d.statusLabels||{};var st=d.statuses||S;
  var map='',groups='',done=0,N=0,soon=[];
  d.sections.forEach(function(s,gi){
    var col=colour(s.color);
    var blocks=s.items.map(function(it){var k=st.indexOf(it.status);return'<i class="blk'+(k>0?' s'+k:'')+'"></i>';}).join('');
    map+='<div class="mrow" style="--sc:'+col+'"><span class="ml">'+esc(s.id)+'</span><i class="k" style="background:'+col+'"></i>'+blocks+'</div>';
    var c=s.items.filter(function(it){return it.status==='complete';}).length;done+=c;N+=s.items.length;
    var isOpen=open[s.id]===undefined?gi===0:open[s.id];
    groups+='<div class="g'+(isOpen?' open':'')+'" data-g="'+esc(s.id)+'" style="--sc:'+col+'"><div class="h"><span class="ch">▶</span><span class="nm">'+esc(s.name)+(s.timing?'<small>'+esc(s.timing)+'</small>':'')+'</span><div class="blocks">'+blocks+'</div><span class="ct">'+c+' / '+s.items.length+' complete</span></div><div class="items">'+
      s.items.map(function(it){var k=st.indexOf(it.status);
        var di=dueInfo(it.due),urgent=di&&di.urgent&&it.status!=='complete';
        if(urgent)soon.push(di.n);
        return'<div class="it c'+k+(urgent?' due':'')+'" data-id="'+esc(it.id)+'"><div class="dial" role="button" tabindex="0" aria-label="'+esc(it.id)+' is '+esc(LAB[it.status]||it.status)+'; change it">'+sprite(k,SC[it.status])+'<span class="w">'+esc(LAB[it.status]||it.status)+'</span></div><div class="t"><span class="ref">'+esc(it.id)+'</span>'+esc(it.title)+'<span class="who'+(it.waitingOn?' w':'')+'">'+esc(it.waitingOn?'waiting on '+it.waitingOn:it.owner)+'</span></div><div class="d">'+(it.due?'<b>'+esc(fmt(it.due))+'</b>'+(di&&di.label?'<span class="rel">'+esc(di.label)+'</span>':''):'')+'</div></div>';}).join('')+'</div></div>';
  });
  $('map').innerHTML=map;$('groups').innerHTML=groups;
  var sp=soonPhrase(soon);
  $('tot').innerHTML=done+' of '+N+' complete'+(sp?' · <span class="soon">'+sp+'</span>':'')+' · <span class="ctl" id="all">expand all</span>';
  $('leg').innerHTML=st.map(function(k,i){return'<span style="color:'+colour(SC[k])+'">'+sprite(i,SC[k])+esc(LAB[k]||k)+'</span>';}).join('');
  if(d.title)$('ttl').firstChild.textContent=d.title;
  strip(d);
}
function accept(d){var sp=stampOf(d);if(sp!==stamp){stamp=sp;last=d;render(d);}else last=d;}
function prov(ageS){
  if(errShown||!last)return;
  var where=LOCAL?'local server':(getToken()?'reading GitHub directly':'reading the published copy, about a minute behind');
  $('prov').textContent='todo.json rev '+last.rev+' · written '+clock(last.updated)+' by '+last.updatedBy+' · checked '+ageS+' s ago · every '+(EVERY/1000)+' s · '+where;
}
function showErr(text){errShown=true;$('prov').innerHTML='<span id="err">'+esc(text)+'</span>'+(last?' · last good rev '+esc(last.rev)+', written '+esc(clock(last.updated)):'');}

/* ---------- token: published copy only. Same key as the board, so one token serves both ---------- */
function getToken(){try{return sessionStorage.getItem(TOK_S)||localStorage.getItem(TOK_S);}catch(e){return null;}}
function forgetToken(){try{sessionStorage.removeItem(TOK_S);localStorage.removeItem(TOK_S);}catch(e){}etag=null;}
function tokCtl(){if(LOCAL){$('tokctl').textContent='';return;}$('tokctl').innerHTML='<span class="ctl" id="tokbtn">'+(getToken()?'token stored · change':'token…')+'</span>';}
function tokenSheet(then){
  var sh=$('sheet');sh.hidden=false;
  sh.innerHTML='<div class="sheet"><p>Clicking a status commits todo.json in <b>'+esc(REPO)+'</b> through api.github.com. This page sends the token nowhere else. Use a fine-grained token limited to that one repository, Contents read and write, short expiry, from github.com → Settings → Developer settings. Only paste it on this page at its real address. Browser storage on this domain is shared by every page on it — use Forget on a machine you do not own.</p><label>Token</label><input type="password" id="tok" autocomplete="off"><label class="inline"><input type="checkbox" id="tokr">remember on this device (otherwise until this tab closes)</label><div class="row"><button class="pri" id="tokgo" type="button">Save</button><button id="tokforget" type="button">Forget stored token</button><button id="tokx" type="button">Cancel</button></div></div>';
  $('tokx').onclick=function(){sh.hidden=true;};
  $('tokforget').onclick=function(){forgetToken();sh.hidden=true;tokCtl();msg('Token forgotten.');};
  $('tokgo').onclick=function(){var t=($('tok').value||'').trim();if(!t)return;try{($('tokr').checked?localStorage:sessionStorage).setItem(TOK_S,t);}catch(e){}sh.hidden=true;tokCtl();msg('');etag=null;errShown=false;poll();if(then)then();};
  $('tok').focus();
}
function b64(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function unb64(c){return new TextDecoder().decode(Uint8Array.from(atob(String(c).replace(/\n/g,'')),function(ch){return ch.charCodeAt(0);}));}
function ghGet(token,useEtag){
  var h={Authorization:'Bearer '+token,Accept:'application/vnd.github+json'};
  if(useEtag&&etag)h['If-None-Match']=etag;
  return fetch(API+'?ref='+BRANCH,{headers:h,cache:'no-store'}).then(function(r){
    if(r.status===304)return null;
    if(r.status===401)throw{code:401};
    if(r.status===403)throw{code:403,rate:r.headers.get('X-RateLimit-Remaining')==='0'};
    if(!r.ok)throw new Error('GitHub read failed: '+r.status);
    if(useEtag)etag=r.headers.get('ETag');
    return r.json().then(function(j){return{sha:j.sha,data:JSON.parse(unb64(j.content))};});
  });
}
function authFail(e){
  if(e.code===401){forgetToken();tokCtl();msg('Token rejected — GitHub says it is not valid.');tokenSheet(null);return true;}
  if(e.code===403){msg(e.rate?'GitHub rate limit reached — it clears within the hour. The token is kept.':'GitHub refused (403). The token may lack Contents write on this repository. It is kept.');return true;}
  return false;
}
/* ---------- writes: absolute status, guarded by the status the page was showing ---------- */
function applyChange(d,id,status,prev){
  var hit=null;d.sections.forEach(function(s){s.items.forEach(function(it){if(it.id===id)hit=it;});});
  if(!hit)throw new Error('no item '+id);
  if((d.statuses||S).indexOf(status)<0)throw new Error('bad status '+status);
  if(hit.status!==prev)throw{conflict:true,now:hit.status};
  hit.status=status;(hit.history=hit.history||[]).push({at:nowIso(),status:status,by:'docket.html'});
  d.rev=(d.rev|0)+1;d.updated=nowIso();d.updatedBy='docket.html';return true;
}
function ghWrite(id,status,prev,attempt){
  var token=getToken();
  if(!token){tokenSheet(function(){ghWrite(id,status,prev,0);});return Promise.resolve(null);}
  attempt=attempt||0;
  msg(attempt?'todo.json moved underneath — retrying…':'Committing '+id+' → '+(LAB[status]||status)+'…');
  return ghGet(token,false).then(function(g){
    var d=g.data;
    try{applyChange(d,id,status,prev);}
    catch(x){
      if(x&&x.conflict){msg(id+' is now '+(LAB[x.now]||x.now)+' — someone changed it elsewhere. Nothing written.');accept(d);return null;}
      throw x;
    }
    return fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'docket: '+id+' → '+status+' (rev '+d.rev+')',content:b64(JSON.stringify(d,null,1)),sha:g.sha,branch:BRANCH})
    }).then(function(put){
      if(put.status===401)throw{code:401};
      if(put.status===403)throw{code:403,rate:put.headers.get('X-RateLimit-Remaining')==='0'};
      if(put.status===409||put.status===422){if(attempt<4)return ghWrite(id,status,prev,attempt+1);throw new Error('kept colliding with other writes — try again in a minute');}
      if(!put.ok)return put.json().catch(function(){return{};}).then(function(b){throw new Error('GitHub write failed ('+put.status+')'+(b.message?': '+b.message:''));});
      return put.json().catch(function(){return{};}).then(function(j){
        var sha=j.commit&&j.commit.sha;etag=null;
        msg(esc(id)+' → '+esc(LAB[status]||status)+' · committed'+(sha&&/^[0-9a-f]{7,40}$/.test(sha)?' · <a href="https://github.com/'+REPO+'/commit/'+sha+'" rel="noopener">commit</a>':'')+' · the published copy follows in about a minute',true);
        return d;
      });
    });
  }).catch(function(e){
    if(!(e&&authFail(e)))msg('Write failed: '+(e&&e.message||e));
    throw e;
  });
}
function localWrite(id,status,prev){
  msg(id+' → '+(LAB[status]||status)+' · writing…');
  return fetch('set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,status:status,prev:prev})})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,code:r.status,j:j};});})
    .then(function(res){
      if(res.code===409){msg(res.j.error||'changed elsewhere; nothing written');return res.j.data||null;}
      if(!res.ok)throw new Error(res.j.error||('HTTP '+res.code));
      if(!res.j.changed){msg(id+' was already '+(LAB[status]||status)+'; nothing written.');return res.j.data;}
      pendingNote=id+' → '+(LAB[status]||status);msg(pendingNote+' · saved, publishing…');
      return res.j.data;
    })
    .catch(function(e){msg('Write failed: '+(e.message||e));throw e;});
}
function cycle(el){
  var row=el.closest('.it');if(!row||row.classList.contains('busy')||!last)return;
  var id=row.dataset.id,cur=null;
  last.sections.forEach(function(s){s.items.forEach(function(it){if(it.id===id)cur=it;});});
  if(!cur)return;
  var st=last.statuses||S,prev=cur.status,next=st[(st.indexOf(prev)+1)%st.length];
  row.classList.add('busy');
  (LOCAL?localWrite(id,next,prev):ghWrite(id,next,prev))
    .then(function(d){if(d)accept(d);})
    .catch(function(){})
    .then(function(){document.querySelectorAll('.it.busy').forEach(function(r){if(r.dataset.id===id)r.classList.remove('busy');});});
}
/* ---------- polling ---------- */
function pushState(){
  if(!LOCAL)return Promise.resolve();
  return fetch('status',{cache:'no-store'}).then(function(r){return r.json();}).then(function(s){
    if(pushSeen===null){pushSeen=s.pushAt;return;}
    if(s.pushAt&&s.pushAt!==pushSeen){
      pushSeen=s.pushAt;
      var tail=s.push==='pushed'?'published '+clock(s.pushAt):s.push;
      msg((pendingNote?pendingNote+' · ':'')+tail);pendingNote='';
    }
  }).catch(function(){});
}
function poll(){
  var tok=!LOCAL&&getToken();
  var p=tok?ghGet(tok,true).then(function(g){return g?g.data:null;})
          :fetch('todo.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
  p.then(function(d){
    lastGood=Date.now();errShown=false;$('bd').classList.remove('stale');
    if(d)accept(d);
    prov(0);
    return pushState();
  }).catch(function(e){
    if(e&&(e.code===401||e.code===403))authFail(e);
    var age=lastGood?Math.round((Date.now()-lastGood)/1000):null;
    if(age===null||age*1000>EVERY*3)$('bd').classList.add('stale');
    showErr((e&&e.message)||('read failed'+(e&&e.code?' ('+e.code+')':'')));
  });
}
document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest)return;
  var dl=t.closest('.dial');if(dl){cycle(dl);return;}
  var h=t.closest('.h');if(h){var g=h.parentElement;g.classList.toggle('open');open[g.dataset.g]=g.classList.contains('open');return;}
  if(t.id==='all'){var any=document.querySelectorAll('.g:not(.open)').length>0;document.querySelectorAll('.g').forEach(function(g){g.classList.toggle('open',any);open[g.dataset.g]=any;});t.textContent=any?'collapse all':'expand all';return;}
  if(t.id==='tokbtn'){tokenSheet(null);return;}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('dial')){e.preventDefault();cycle(e.target);}
});
tokCtl();poll();setInterval(poll,EVERY);
setInterval(function(){if(last&&lastGood)prov(Math.round((Date.now()-lastGood)/1000));},1000);
})();
</script></body></html>
